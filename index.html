<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clients &amp; pipeline</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&display=swap" rel="stylesheet">
<style>
:root{--ink:#18202C;--muted:#5D6878;--line:#DCE1E8;--bg:#F2F4F7;--card:#fff;
--cold:#5B8FD0;--warm:#E0A030;--hot:#DE4A2C;--proposal:#A8235A;--won:#2E8B57;--lost:#8A93A0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Archivo,system-ui,sans-serif;font-size:15px;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 96px}
h1{font-stretch:120%;font-weight:800;font-size:30px;line-height:1.05;margin:0 0 14px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 18px}
.tabs{display:flex;gap:4px;background:#E4E8EE;border-radius:10px;padding:4px;margin-bottom:18px}
.tab{flex:1;border:0;background:none;padding:9px 2px;font-size:14px;border-radius:7px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer}
.tab.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(24,32,44,.12)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:22px}
.stats.four{grid-template-columns:1fr 1fr;margin-bottom:10px}
.stat{background:var(--card);padding:10px 12px}
.stat b{display:block;font-stretch:115%;font-size:20px;font-weight:750}
.stat span{color:var(--muted);font-size:12.5px}
.stat.alert b{color:var(--hot)}
#funnel{display:flex;flex-direction:column;align-items:stretch;margin-bottom:26px}
.seg{border:0;cursor:pointer;height:62px;background:var(--c);color:#fff;font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .15s}
.seg .top{display:flex;align-items:baseline;gap:8px}
.seg .cnt{font-stretch:125%;font-weight:800;font-size:24px;line-height:1}
.seg .nm{font-weight:600;font-size:15px}
.seg .val{font-size:12.5px;opacity:.9}
#funnel.filtering .seg:not(.on){opacity:.35}
.seg:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[role=button]:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.conv{height:22px;display:flex;align-items:center;justify-content:center;font-size:12.5px;color:var(--muted)}
.bar{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px}
.bar h2{font-size:18px;font-stretch:115%;margin:0}
.link{background:none;border:0;color:var(--muted);font:inherit;text-decoration:underline;cursor:pointer;padding:4px}
.group{margin-bottom:22px}
.ghead{display:flex;align-items:baseline;gap:8px;border-left:4px solid var(--c);padding-left:10px;margin-bottom:8px}
.ghead b{font-size:15px}
.ghead span{color:var(--muted);font-size:13px}
.lead{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.lead .main{flex:1;min-width:0;cursor:pointer}
.lead .nm{font-weight:650}
.lead .co{color:var(--muted);font-size:13.5px}
.lead .next{font-size:13.5px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-block;font-size:12px;padding:1px 7px;border-radius:20px;background:#FDE8E3;color:#A3321C;margin-top:5px}
.money{font-weight:650;font-stretch:110%;white-space:nowrap}
.moves{display:flex;flex-direction:column;gap:4px}
.mv{width:34px;height:30px;border-radius:7px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:15px;color:var(--ink)}
.mv:disabled{opacity:.3;cursor:default}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--muted)}
.btn{font:inherit;font-weight:650;border-radius:9px;padding:11px 16px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:#fff}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.danger{background:#fff;color:#A3321C;border-color:#F0C3B8}
.fab{position:fixed;right:16px;bottom:18px;box-shadow:0 6px 18px rgba(24,32,44,.25)}
/* analytics */
.note{font-size:13px;color:var(--muted);margin:0 0 16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.panel h3{margin:0 0 2px;font-size:16px;font-stretch:112%}
.panel .q{color:var(--muted);font-size:13px;margin:0 0 12px}
.hb{display:grid;grid-template-columns:104px 1fr 72px;gap:8px;align-items:center;font-size:13.5px;margin:7px 0}
.hb .r{text-align:right;font-weight:600}
.track{height:12px;background:#EEF1F5;border-radius:6px;overflow:hidden;display:flex}
.fill{height:100%;background:var(--c,var(--ink))}
.fill.fc{background:repeating-linear-gradient(135deg,#E0A030 0 6px,#EBBE6E 6px 12px)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:0 6px 6px 0;border-bottom:1px solid var(--line)}
td{padding:8px 6px 8px 0;border-bottom:1px solid #EEF1F5}
td.n,th.n{text-align:right}
.cols{display:flex;align-items:flex-end;gap:6px;height:120px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11.5px;color:var(--muted);gap:3px}
.col i{display:block;width:100%;background:var(--cold);border-radius:4px 4px 0 0;min-height:2px}
.col b{color:var(--ink);font-weight:600}
.goalrow{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.goalrow input{max-width:160px}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:520px){.split{grid-template-columns:1fr}}
dialog{border:0;border-radius:14px;padding:0;width:min(520px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(24,32,44,.45)}
.sheet{padding:18px}
.sheet h3{margin:0 0 12px;font-stretch:115%;font-size:20px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.actions .spacer{flex:1}
[hidden]{display:none!important}
.savenote{font-size:12.5px;color:var(--won);margin:-8px 0 14px}
.savenote.bad{color:#A3321C}
.backup{display:flex;gap:16px;justify-content:center;margin-top:8px}
.backup .link{margin:0;font-size:13px;display:inline}
/* crm */
.hint{color:var(--muted);font-size:13.5px;margin:0 0 10px}
h2.sec{font-size:17px;font-stretch:115%;margin:24px 0 10px}
.row{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.row .main{flex:1;min-width:0;cursor:pointer}
.row .nm{font-weight:650}
.row .co,.co{color:var(--muted);font-size:13.5px}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px;vertical-align:1px}
.pill.active{background:#E2F2E8;color:#1F6B41}.pill.prospect{background:#E4EDF8;color:#2F5F9A}
.pill.paused{background:#FBF0D9;color:#85570A}.pill.former{background:#ECEEF1;color:#5D6878}
.due{font-size:12.5px;color:var(--muted)}.due.late{color:#A3321C;font-weight:650}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.check{width:28px;height:28px;flex:none;border-radius:50%;border:2px solid #B9C1CC;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;padding:0}
.check.done{background:var(--won);border-color:var(--won)}
.struck{text-decoration:line-through;color:var(--muted)}
.search{margin-bottom:10px;-webkit-appearance:none}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 10px;padding:0 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font:inherit;font-size:13.5px;cursor:pointer;color:var(--ink)}
.fchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.fchip small{opacity:.65;margin-left:3px;font-size:12px}
.mkt{font-size:13.5px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-left:4px solid var(--ink);border-radius:8px;padding:9px 12px;margin:2px 0 14px}
.back{text-decoration:none;padding:4px 0;margin-bottom:6px;color:var(--ink);font-weight:600}
.aname{font-stretch:118%;font-weight:800;font-size:26px;line-height:1.1;margin:4px 0 6px;letter-spacing:-.01em}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 18px}
.acts .btn{padding:8px 12px;font-size:14px}
.btn.sm{padding:6px 10px;font-size:13px;text-decoration:none;display:inline-block}
.links{display:flex;gap:6px;flex:none}
.notes{margin:0;white-space:pre-wrap;font-size:14px}
.co a{color:var(--ink)}
.tl{border-left:2px solid var(--line);margin:0 0 0 5px;padding-left:16px}
.ev{position:relative;padding:2px 0 12px}
.ev::before{content:"";position:absolute;left:-22px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--c,var(--muted));box-shadow:0 0 0 3px var(--bg)}
.ev b{font-weight:650}.ev .d{color:var(--muted);font-size:12.5px;margin-left:4px}
.ev p{margin:3px 0 0;font-size:14px;white-space:pre-wrap}
.ev[role=button]{cursor:pointer}
#fBody{display:grid;grid-template-columns:1fr 1fr;column-gap:10px}
#fBody>div{grid-column:1/-1;min-width:0}#fBody>div.half{grid-column:auto}
.lead .linkline{margin-top:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Clients &amp; pipeline</h1>
  <div class="tabs" role="tablist">
    <button class="tab on" role="tab" data-tab="today" aria-selected="true">Today</button>
    <button class="tab" role="tab" data-tab="pipe" aria-selected="false">Pipeline</button>
    <button class="tab" role="tab" data-tab="clients" aria-selected="false">Clients</button>
    <button class="tab" role="tab" data-tab="stats" aria-selected="false">Analytics</button>
  </div>
  <p class="savenote" id="saveNote" role="status"></p>

  <section id="todayView"></section>

  <section id="pipeView" hidden>
    <p class="sub">Tap a stage to filter. Use the arrows to move a lead up or down.</p>
    <div class="stats" id="stats"></div>
    <div id="funnel"></div>
    <div class="bar"><h2 id="listTitle">All leads</h2><button class="link" id="toggleLost"></button></div>
    <div id="list"></div>
  </section>

  <section id="clientsView" hidden></section>
  <section id="acctView" hidden></section>
  <section id="statsView" hidden></section>

  <div class="backup"><button class="link" id="backupBtn">Back up data</button><label class="link" for="restoreIn">Restore from backup</label><input type="file" id="restoreIn" accept=".json,application/json" hidden></div>
</div>
<button class="btn fab" id="addBtn">Add task</button>

<datalist id="acctList"></datalist><datalist id="mktList"></datalist><datalist id="regList"></datalist>

<dialog id="dlg"><div class="sheet">
  <h3 id="dlgTitle">Add lead</h3>
  <label for="f-name">Name</label><input id="f-name" autocomplete="off">
  <label for="f-company">Company</label><input id="f-company" list="acctList" autocomplete="off">
  <button class="link" id="openAcctBtn" hidden>Open client record</button>
  <div id="mktRow" hidden><label for="f-market">Market for this new client</label><input id="f-market" list="mktList" placeholder="e.g. Healthcare" autocomplete="off"></div>
  <div class="row2">
    <div><label for="f-value">Deal value ($)</label><input id="f-value" type="number" inputmode="numeric" min="0"></div>
    <div><label for="f-stage">Stage</label><select id="f-stage"></select></div>
  </div>
  <div id="reasonRow" hidden><label for="f-reason">Why was it lost?</label>
    <select id="f-reason"><option value="">Choose a reason</option><option>Price</option><option>Timing</option><option>Went with competitor</option><option>No response</option><option>Not a fit</option><option>Other</option></select></div>
  <div class="row2">
    <div><label for="f-source">Source</label>
      <select id="f-source"><option>Referral</option><option>Inbound</option><option>Cold outreach</option><option>LinkedIn</option><option>Event</option><option>Existing client</option><option>Other</option></select></div>
    <div><label for="f-last">Last contact</label><input id="f-last" type="date"></div>
  </div>
  <label for="f-next">Next step</label><input id="f-next" placeholder="e.g. Send case study Tuesday" autocomplete="off">
  <label for="f-notes">Notes</label><textarea id="f-notes" rows="3"></textarea>
  <div class="actions">
    <button class="btn" id="saveBtn">Save lead</button>
    <button class="btn ghost" id="touchBtn">Contacted today</button>
    <span class="spacer"></span>
    <button class="btn danger" id="delBtn">Delete</button>
    <button class="btn ghost" id="cancelBtn">Cancel</button>
  </div>
</div></dialog>

<dialog id="fdlg"><div class="sheet">
  <h3 id="fTitle"></h3>
  <div id="fBody"></div>
  <div class="actions">
    <button class="btn" id="fSave">Save</button>
    <span class="spacer"></span>
    <button class="btn danger" id="fDel">Delete</button>
    <button class="btn ghost" id="fCancel">Cancel</button>
  </div>
</div></dialog>
<script>
const STAGES=[
 {k:'cold',n:'Cold',p:.05,stale:30,d:'Fits your ideal client, no real conversation yet'},
 {k:'warm',n:'Warm',p:.20,stale:14,d:'Engaged: replied, took a call, asked questions'},
 {k:'hot',n:'Hot',p:.50,stale:5,d:'Clear need, budget, and timing; talking specifics'},
 {k:'proposal',n:'Proposal',p:.70,stale:3,d:'Proposal or quote is in their hands'},
 {k:'won',n:'Won',p:1,stale:null,d:'Signed'}];
const LOST={k:'lost',n:'Lost',d:'Went dark or said no'};
const MARKETS=['Education','Healthcare','Finance','Fashion'];
const STATUSES=[{k:'active',n:'Active client'},{k:'prospect',n:'Prospect'},{k:'paused',n:'Paused'},{k:'former',n:'Former client'}];
const ACT_TYPES=['Call','Meeting','Email','Note'];
const QUIET_DAYS=30;
const $=s=>document.querySelector(s);
const idx=k=>STAGES.findIndex(s=>s.k===k);
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>iso(new Date());
const dd=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
const days=d=>d?dd(d,today()):null;
const money=n=>'$'+(n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e4?Math.round(n/1e3)+'k':n>=1e3?(n/1e3).toFixed(1)+'k':Math.round(n));
const sum=a=>a.reduce((x,l)=>x+(+l.value||0),0);
const pct=x=>x==null?'—':Math.round(x*100)+'%';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const byName=(a,b)=>a.name.localeCompare(b.name);
const fmtDate=d=>{const x=new Date(d+'T12:00:00'); return x.toLocaleDateString(undefined,x.getFullYear()===new Date().getFullYear()?{month:'short',day:'numeric'}:{month:'short',day:'numeric',year:'numeric'});};
const when=d=>{const n=days(d); return n==null?'Never':n===0?'Today':n===1?'Yesterday':n>1?`${n} days ago`:fmtDate(d);};
const dueText=d=>{const n=dd(today(),d); return n===0?'Due today':n===1?'Due tomorrow':n<0?`${-n} day${n===-1?'':'s'} overdue`:`Due ${fmtDate(d)}`;};
function bindOpen(el,fn){ el.onclick=fn; el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fn();}}; }

let leads=[],accounts=[],contacts=[],acts=[],tasks=[],settings={goal:0};
let filter='all',showLost=false,editing=null,tab='today',openAcct=null;
let mktFilter='all',statusFilter='all',query='',showAllTasks=false,showAllTl=false;

// Cloud sync: data lives in Netlify Blobs behind /api/leads.
const API='/api/leads';
let rev=0, saving=Promise.resolve(), serverOld=false;
const snapshot=()=>({leads,settings,accounts,contacts,activities:acts,tasks,rev});
function readCache(){ try{ return JSON.parse(localStorage.getItem('funnel-cache')||'null'); }catch(e){ return null; } }
function cacheLocal(){ try{ localStorage.setItem('funnel-cache',JSON.stringify(snapshot())); }catch(e){} }
async function api(method,body){
  const r=await fetch(API,{method,headers:{'content-type':'application/json'},body:body?JSON.stringify(body):undefined});
  const d=await r.json().catch(()=>({}));
  if(r.status===409) return {conflict:true,...d};
  if(!r.ok) throw new Error(d.error||'Server error');
  return d;
}
function apply(d,fromServer){
  leads=d.leads||[]; settings=d.settings||{goal:0}; rev=d.rev||0;
  let src=d;
  if(fromServer){ serverOld=!Array.isArray(d.accounts); if(serverOld) src=readCache()||{}; }
  accounts=src.accounts||[]; contacts=src.contacts||[]; acts=src.activities||[]; tasks=src.tasks||[];
  leads.forEach(l=>{ if(!l.hist) l.hist=[{s:l.stage,d:l.created||today()}]; });
  const changed=linkAccounts();
  cacheLocal(); render(); return changed;
}
function showSave(state){
  const el=$('#saveNote'); if(!el) return;
  const msg={ok:'Saved. Syncs across all your devices.',
    fail:"Couldn't reach the server. Your change is kept on this device and will sync with your next change.",
    offline:"Can't reach the server right now. Showing the last copy saved on this device.",
    old:"Leads are syncing, but clients, contacts, activity, and tasks are only saved on this device until the updated leads.mjs is on GitHub.",
    conflict:'This was just changed on another device, so the latest version was loaded. Redo your last change if it is missing.'}[state];
  el.textContent=msg; el.className='savenote'+(state==='ok'?'':' bad');
}
async function pull(){ const ch=apply(await api('GET'),true); showSave(serverOld?'old':'ok'); if(ch) save(); }
async function push(){
  try{
    const d=await api('PUT',snapshot());
    if(d.conflict){ apply(d,true); showSave('conflict'); return; }
    rev=d.rev; serverOld=!Array.isArray(d.accounts); cacheLocal(); showSave(serverOld?'old':'ok');
  }catch(e){ cacheLocal(); showSave('fail'); }
}
const save=()=>(saving=saving.then(push));
const saveSettings=save;
async function load(){
  try{ await pull(); }
  catch(e){
    const c=readCache(); if(c) apply(c,false);
    showSave('offline'); render();
  }
}
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&!document.querySelector('dialog[open]')) saving.then(()=>pull()).catch(()=>{});
});
function backup(){
  const blob=new Blob([JSON.stringify({leads,settings,accounts,contacts,activities:acts,tasks,exported:today()},null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`clients-pipeline-backup-${today()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
}
function restore(file){
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!Array.isArray(d.leads)) throw 0;
      if((leads.length||accounts.length)&&!confirm(`Replace everything here with the backup? It has ${d.leads.length} leads${d.accounts?` and ${d.accounts.length} clients`:''}.`)) return;
      leads=d.leads; settings=d.settings||settings;
      accounts=d.accounts||[]; contacts=d.contacts||[]; acts=d.activities||[]; tasks=d.tasks||[];
      linkAccounts(); save(); render();
    }catch(e){ alert("That file isn't a backup from this app. Choose a .json file made with Back up data."); } };
  r.readAsText(file);
}

// Clients
const findAcct=name=>{const n=name.trim().toLowerCase(); return accounts.find(a=>a.name.trim().toLowerCase()===n);};
function ensureAcct(name,market){
  let a=findAcct(name);
  if(!a){ a={id:uid(),name:name.trim(),market:market||'',region:'',status:'prospect',website:'',notes:'',created:today()}; accounts.push(a); }
  return a;
}
function linkAccounts(){
  let ch=false;
  leads.forEach(l=>{
    if(l.accountId&&accounts.some(a=>a.id===l.accountId)) return;
    if(l.company&&l.company.trim()){ const a=ensureAcct(l.company); l.accountId=a.id; l.company=a.name; if(l.stage==='won'&&a.status==='prospect') a.status='active'; ch=true; }
    else if(l.accountId){ l.accountId=''; ch=true; }
  });
  return ch;
}
const acctOf=l=>accounts.find(a=>a.id===l.accountId);
const dealsOf=a=>leads.filter(l=>l.accountId===a.id);
const isOpen=l=>idx(l.stage)>=0&&l.stage!=='won';
const marketOf=l=>acctOf(l)?.market||'Unassigned';
function lastTouch(a){
  let m=''; const t=today();
  acts.forEach(x=>{ if(x.accountId===a.id&&x.date&&x.date<=t&&x.date>m) m=x.date; });
  dealsOf(a).forEach(l=>{ if(l.last&&l.last<=t&&l.last>m) m=l.last; });
  return m||null;
}
const statusOf=a=>STATUSES.find(s=>s.k===a.status)||STATUSES[1];
function markWon(l){ const a=acctOf(l); if(a&&l.stage==='won'&&a.status==='prospect') a.status='active'; }

function track(l){ l.hist=l.hist||[]; const last=l.hist[l.hist.length-1]; if(!last||last.s!==l.stage) l.hist.push({s:l.stage,d:today()}); }
function wonDate(l){ const h=(l.hist||[]).filter(x=>x.s==='won'); return h.length?h[h.length-1].d:(l.last||l.created||today()); }
function staleDays(l){ const s=STAGES[idx(l.stage)]; if(!s||!s.stale) return 0; const d=days(l.last); return d!==null&&d>s.stale?d:0; }
const openLeads=()=>leads.filter(isOpen);
const weighted=a=>a.reduce((x,l)=>x+(+l.value||0)*STAGES[idx(l.stage)].p,0);

// Tabs and routing
const VIEWS={today:'#todayView',pipe:'#pipeView',clients:'#clientsView',stats:'#statsView'};
function setTab(t){

}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
function openAccount(id){ setTab('clients'); openAcct=id; showAllTl=false; render(); window.scrollTo(0,0); }
function refreshLists(){
  $('#acctList').innerHTML=accounts.slice().sort(byName).map(a=>`<option value="${esc(a.name)}">`).join('');

function render(){
  if(openAcct&&!accounts.some(a=>a.id===openAcct)) openAcct=null;

  Object.entries(VIEWS).forEach(([k,s])=>{ $(s).hidden=!(k===tab&&!inAcct); });

// Shared rows
function section(parent,title,rows,empty,hint){
  const h=document.createElement('h2'); h.className='sec'; h.textContent=title; parent.appendChild(h);
  if(hint){ const p=document.createElement('p'); p.className='hint'; p.textContent=hint; parent.appendChild(p); }
  if(!rows.length){ const p=document.createElement('p'); p.className='hint'; p.textContent=empty; parent.appendChild(p); }
  else rows.forEach(r=>parent.appendChild(r));
}
function taskRow(t,showClient){
  const r=document.createElement('div'); r.className='row';
  const late=!t.done&&t.due&&t.due<today(), a=accounts.find(z=>z.id===t.accountId);
  r.innerHTML=`<button class="check${t.done?' done':''}" aria-label="${t.done?'Mark not done':'Mark done'}: ${esc(t.title)}">${t.done?'✓':''}</button>
    <div class="main" tabindex="0" role="button"><div class="nm${t.done?' struck':''}">${esc(t.title)}</div>
    <div class="co">${showClient&&a?esc(a.name)+' / ':''}<span class="due${late?' late':''}">${t.due?dueText(t.due):'No due date'}</span></div></div>`;

}
function leadMini(l,showCompany){

function acctRow(a){

// Today
function renderToday(){
  const v=$('#todayView'), t0=today();
  const open=tasks.filter(t=>!t.done);
  const overdue=open.filter(t=>t.due&&t.due<t0), dueToday=open.filter(t=>t.due===t0);
  const week=open.filter(t=>!t.due||t.due>=t0&&dd(t0,t.due)<=7);
  const later=open.filter(t=>t.due&&dd(t0,t.due)>7);
  const stale=openLeads().filter(staleDays).sort((a,b)=>staleDays(b)-staleDays(a));
  const quiet=accounts.filter(a=>a.status==='active').map(a=>({a,d:lastTouch(a)}))
    .filter(x=>!x.d||days(x.d)>QUIET_DAYS).sort((x,y)=>(x.d||'').localeCompare(y.d||''));
  v.innerHTML=`<div class="stats">
    <div class="stat ${overdue.length?'alert':''}"><b>${overdue.length}</b><span>Overdue tasks</span></div>
    <div class="stat"><b>${dueToday.length}</b><span>Due today</span></div>
    <div class="stat ${stale.length?'alert':''}"><b>${stale.length}</b><span>Leads to follow up</span></div></div>`;
  if(!tasks.length&&!leads.length&&!accounts.length){
    v.innerHTML+=`<div class="empty"><p>Nothing here yet. Add a task, a lead, or a client, or load example data to see how it all fits together.</p><button class="btn ghost" id="sample2">Load example data</button></div>`;
    $('#sample2').onclick=loadSamples; return;
  }
  const shown=(showAllTasks?[...overdue,...week,...later]:[...overdue,...week]).sort((a,b)=>(a.due||'9').localeCompare(b.due||'9'));
  section(v,'Tasks',shown.map(t=>taskRow(t,true)),later.length?'Nothing due in the next 7 days.':'No open tasks. Add one with the button below.');
  if(later.length){ const b=document.createElement('button'); b.className='link'; b.textContent=showAllTasks?'Show only the next 7 days':`Show ${later.length} later task${later.length>1?'s':''}`; b.onclick=()=>{showAllTasks=!showAllTasks;render();}; v.appendChild(b); }
  section(v,'Leads to follow up',stale.map(l=>leadMini(l,true)),'Every open lead has been contacted recently.');
  section(v,'Clients gone quiet',quiet.map(x=>acctRow(x.a)),`You've been in touch with every active client in the last ${QUIET_DAYS} days.`,quiet.length?`Active clients with no logged contact in ${QUIET_DAYS}+ days.`:'');
}

function renderClientList(){
  const q=query.trim().toLowerCase(), order=STATUSES.map(s=>s.k);
  const hit=a=>!q||[a.name,a.market,a.region,a.notes,a.website,
    ...contacts.filter(c=>c.accountId===a.id).flatMap(c=>[c.name,c.role,c.email,c.notes]),
    ...acts.filter(x=>x.accountId===a.id).map(x=>x.note),
    ...dealsOf(a).flatMap(l=>[l.name,l.notes,l.next])].some(t=>(t||'').toLowerCase().includes(q));

// One client
function renderAcct(){
  const a=accounts.find(x=>x.id===openAcct), v=$('#acctView'), st=statusOf(a), t0=today();
  const deals=dealsOf(a), open=deals.filter(isOpen), won=deals.filter(l=>l.stage==='won'), lt=lastTouch(a);
  const quiet=a.status==='active'&&(!lt||days(lt)>QUIET_DAYS);
  const cs=contacts.filter(c=>c.accountId===a.id).sort(byName);
  const ts=tasks.filter(t=>t.accountId===a.id&&!t.done).sort((x,y)=>(x.due||'9').localeCompare(y.due||'9'));

    <div class="stats"><div class="stat"><b>${money(sum(open))}</b><span>Open pipeline</span></div>
      <div class="stat"><b>${money(sum(won))}</b><span>Won to date</span></div>
      <div class="stat ${quiet?'alert':''}"><b>${lt?when(lt):'None yet'}</b><span>Last contact</span></div></div>
    ${a.notes?`<div class="panel"><p class="notes">${esc(a.notes)}</p></div>`:''}
    <div id="aBody"></div>`;
  const b=$('#aBody');
  section(b,'Open tasks',ts.map(t=>taskRow(t,false)),'No open tasks.');
  const so=l=>l.stage==='lost'?9:l.stage==='won'?8:-idx(l.stage);
  section(b,'Deals',deals.slice().sort((x,y)=>so(x)-so(y)).map(l=>leadMini(l,false)),'No deals yet.');
  section(b,'Contacts',cs.map(contactRow),'No contacts yet.');
  // Timeline
  const ev=[];
  acts.filter(x=>x.accountId===a.id).forEach(x=>ev.push({d:x.date,o:0,x}));
  deals.forEach(l=>(l.hist||[]).forEach((h,i)=>ev.push({d:h.d,o:1,l,h,first:i===0})));
  tasks.filter(t=>t.accountId===a.id&&t.done&&t.doneOn).forEach(t=>ev.push({d:t.doneOn,o:2,t}));
  ev.sort((x,y)=>(y.d||'').localeCompare(x.d||'')||x.o-y.o);
  const h=document.createElement('h2'); h.className='sec'; h.textContent='Activity'; b.appendChild(h);
  if(!ev.length){ const p=document.createElement('p'); p.className='hint'; p.textContent='Nothing logged yet. Use Log activity after a call, meeting, or email.'; b.appendChild(p); }
  else{
    const tl=document.createElement('div'); tl.className='tl';
    (showAllTl?ev:ev.slice(0,15)).forEach(e=>{
      const d=document.createElement('div'); d.className='ev';
      if(e.x){
        const l=leads.find(z=>z.id===e.x.leadId);
        d.style.setProperty('--c','var(--ink)'); d.tabIndex=0; d.setAttribute('role','button');
        d.innerHTML=`<b>${esc(e.x.type)}</b>${l?' / '+esc(l.name):''}<span class="d">${e.d?fmtDate(e.d):''}</span>${e.x.note?`<p>${esc(e.x.note)}</p>`:''}`;
        bindOpen(d,()=>logAct(e.x));
      }else if(e.l){
        const s=STAGES[idx(e.h.s)]||LOST;

        d.style.setProperty('--c','var(--won)');

    });
    b.appendChild(tl);
    if(ev.length>15){ const m=document.createElement('button'); m.className='link'; m.textContent=showAllTl?'Show less':`Show ${ev.length-15} older`; m.onclick=()=>{showAllTl=!showAllTl;render();}; b.appendChild(m); }
  }
  $('#backBtn').onclick=()=>{openAcct=null;render();window.scrollTo(0,0);};
  $('#aLog').onclick=()=>logAct(null,a.id);
  $('#aTask').onclick=()=>editTask(null,a.id);
  $('#aDeal').onclick=()=>openEditor(null,a);
  $('#aContact').onclick=()=>editContact(null,a.id);
  $('#aEdit').onclick=()=>editAcct(a);
}

// Generic form dialog
let fcfg=null;

    else if(f.type==='textarea') c=`<textarea id="${id}" rows="${f.rows||3}" placeholder="${esc(f.placeholder||'')}">${esc(v)}</textarea>`;
    else c=`<input id="${id}" type="${f.type||'text'}" value="${esc(v)}" placeholder="${esc(f.placeholder||'')}"${f.list?` list="${f.list}"`:''}${f.type==='tel'?' inputmode="tel"':''} autocomplete="off">`;

const fval=id=>{const el=$('#ff-'+id); return el?el.value.trim():'';};
function need(id,msg){ const el=$('#ff-'+id); if(el.value.trim()) return true; el.placeholder=msg; el.focus(); return false; }
$('#fSave').onclick=()=>{ if(fcfg.onSave()!==false){ $('#fdlg').close(); save(); render(); } };
$('#fDel').onclick=()=>{ if(fcfg.onDelete&&fcfg.onDelete()!==false){ $('#fdlg').close(); save(); render(); } };
$('#fCancel').onclick=()=>$('#fdlg').close();

function editAcct(a){
  form({title:a?'Edit client':'Add client',saveLabel:a?'Save client':'Add client',fields:[
    {id:'name',label:'Company name',value:a?.name},
    {id:'market',label:'Market',value:a?.market,list:'mktList',placeholder:'e.g. Healthcare',half:1},
    {id:'region',label:'Region',value:a?.region,list:'regList',placeholder:'e.g. Lynchburg',half:1},
    {id:'status',label:'Status',type:'select',options:STATUSES.map(s=>[s.k,s.n]),value:a?.status||'prospect',half:1},
    {id:'website',label:'Website',type:'url',value:a?.website,placeholder:'example.com',half:1},
    {id:'notes',label:'Notes',type:'textarea',value:a?.notes,rows:4,placeholder:'Goals, services you provide, contract details'}],
    onSave:()=>{
      if(!need('name','Add a company name to save')) return false;
      const name=fval('name'), dup=findAcct(name);
      if(dup&&dup!==a){ alert(`${dup.name} is already in your clients.`); return false; }
      const d={name,market:fval('market'),region:fval('region'),status:fval('status'),website:fval('website'),notes:fval('notes')};
      if(a){ Object.assign(a,d); leads.forEach(l=>{ if(l.accountId===a.id) l.company=name; }); }
      else{ const n={id:uid(),created:today(),...d}; accounts.push(n); openAcct=n.id; showAllTl=false; }
    },
    onDelete:a?()=>{
      const n=dealsOf(a).length;
      if(!confirm(`Delete ${a.name}? This also deletes its contacts, activity, and tasks${n?`, plus ${n} deal${n>1?'s':''}`:''}.`)) return false;
      leads=leads.filter(l=>l.accountId!==a.id); contacts=contacts.filter(c=>c.accountId!==a.id);
      acts=acts.filter(x=>x.accountId!==a.id); tasks=tasks.filter(t=>t.accountId!==a.id);
      accounts=accounts.filter(x=>x!==a); openAcct=null;
    }:null});
}
function editContact(c,acctId){
  form({title:c?'Edit contact':'Add contact',saveLabel:'Save contact',fields:[
    {id:'name',label:'Name',value:c?.name},
    {id:'role',label:'Role',value:c?.role,placeholder:'e.g. Marketing director'},
    {id:'email',label:'Email',type:'email',value:c?.email,half:1},
    {id:'phone',label:'Phone',type:'tel',value:c?.phone,half:1},
    {id:'notes',label:'Notes',type:'textarea',value:c?.notes,rows:2}],
    onSave:()=>{
      if(!need('name','Add a name to save')) return false;
      const d={name:fval('name'),role:fval('role'),email:fval('email'),phone:fval('phone'),notes:fval('notes')};
      if(c) Object.assign(c,d); else contacts.push({id:uid(),accountId:acctId,...d});
    },
    onDelete:c?()=>{ if(!confirm(`Delete ${c.name}?`)) return false; contacts=contacts.filter(x=>x!==c); }:null});
}
function logAct(x,acctId){
  const a=accounts.find(z=>z.id===(x?x.accountId:acctId)); if(!a) return;
  const deals=dealsOf(a).filter(l=>l.stage!=='lost'||l.id===x?.leadId);
  form({title:x?'Edit activity':'Log activity',saveLabel:x?'Save':'Log activity',noFocus:!x,fields:[
    {id:'type',label:'Type',type:'select',options:ACT_TYPES,value:x?.type||'Call',half:1},
    {id:'date',label:'Date',type:'date',value:x?.date||today(),half:1},
    ...(deals.length?[{id:'lead',label:'Related deal (optional)',type:'select',options:[['','None'],...deals.map(l=>[l.id,l.name+(l.value?` (${money(+l.value)})`:'')])],value:x?.leadId||''}]:[]),
    {id:'note',label:'What happened?',type:'textarea',value:x?.note,rows:4,placeholder:'e.g. Talked Q1 budget; wants a proposal by the 15th'}],
    onSave:()=>{
      const d={type:fval('type'),date:fval('date')||today(),note:fval('note'),leadId:fval('lead')};
      if(x) Object.assign(x,d); else acts.push({id:uid(),accountId:a.id,...d});
      const l=leads.find(z=>z.id===d.leadId);
      if(l&&d.type!=='Note'&&d.date<=today()&&(!l.last||d.date>l.last)) l.last=d.date;
    },
    onDelete:x?()=>{ if(!confirm('Delete this activity?')) return false; acts=acts.filter(z=>z!==x); }:null});
}
function editTask(t,acctId){
  form({title:t?'Edit task':'Add task',saveLabel:t?'Save task':'Add task',fields:[
    {id:'title',label:'Task',value:t?.title,placeholder:'e.g. Send Q1 proposal'},
    {id:'due',label:'Due',type:'date',value:t?t.due:today(),half:1},
    {id:'acct',label:'Client',type:'select',options:[['','None'],...accounts.slice().sort(byName).map(a=>[a.id,a.name])],value:t?t.accountId:(acctId||''),half:1}],
    onSave:()=>{
      if(!need('title','Add a task to save')) return false;
      const d={title:fval('title'),due:fval('due'),accountId:fval('acct')};
      if(t) Object.assign(t,d); else tasks.push({id:uid(),done:false,created:today(),...d});
    },
    onDelete:t?()=>{ tasks=tasks.filter(z=>z!==t); }:null});
}

function renderPipeline(){
  const open=openLeads(), stale=open.filter(staleDays).length;
  $('#stats').innerHTML=
    `<div class="stat"><b>${money(sum(open))}</b><span>Open pipeline</span></div>
     <div class="stat"><b>${money(weighted(open))}</b><span>Weighted forecast</span></div>
     <div class="stat ${stale?'alert':''}"><b>${stale}</b><span>Need follow-up</span></div>`;
  const f=$('#funnel'); f.innerHTML=''; f.classList.toggle('filtering',filter!=='all');
  const reached=i=>leads.filter(l=>(l.max??0)>=i).length;
  STAGES.forEach((s,i)=>{
    const inS=leads.filter(l=>l.stage===s.k);
    const a=(i*12)/2, b=((i+1)*12)/2;
    const seg=document.createElement('button');
    seg.className='seg'+(filter===s.k?' on':'');
    seg.style.setProperty('--c',`var(--${s.k})`);
    seg.style.clipPath=`polygon(${a}% 0,${100-a}% 0,${100-b}% 100%,${b}% 100%)`;
    seg.setAttribute('aria-pressed',filter===s.k);
    seg.innerHTML=`<span class="top"><span class="cnt">${inS.length}</span><span class="nm">${s.n}</span></span><span class="val">${money(sum(inS))}</span>`;
    seg.onclick=()=>{filter=filter===s.k?'all':s.k;render();};
    f.appendChild(seg);
    if(i<STAGES.length-1){
      const r0=reached(i),r1=reached(i+1), c=document.createElement('div'); c.className='conv';
      c.textContent=r0?`${Math.round(r1/r0*100)}% made it to ${STAGES[i+1].n}`:''; f.appendChild(c);
    }
  });
  const lostN=leads.filter(l=>l.stage==='lost').length;
  $('#toggleLost').textContent=showLost?'Hide lost':`Show lost (${lostN})`;
  $('#toggleLost').style.visibility=lostN?'visible':'hidden';
  $('#listTitle').textContent=filter==='all'?'All leads':STAGES[idx(filter)].n+' leads';
  const groups=(filter==='all'?[...STAGES].reverse():[STAGES[idx(filter)]]).concat(showLost&&filter==='all'?[LOST]:[]);
  const list=$('#list'); list.innerHTML='';
  if(!leads.length){
    list.innerHTML=`<div class="empty"><p>No leads yet. Add your first one, or load a few examples to see how it works.</p><button class="btn ghost" id="sample">Load example leads</button></div>`;
    $('#sample').onclick=loadSamples; return;
  }
  groups.forEach(g=>{
    const items=leads.filter(l=>l.stage===g.k).sort((x,y)=>staleDays(y)-staleDays(x)||(+y.value||0)-(+x.value||0));
    if(!items.length&&filter==='all') return;
    const wrap=document.createElement('div'); wrap.className='group';
    wrap.innerHTML=`<div class="ghead" style="--c:var(--${g.k})"><b>${g.n}</b><span>${g.d}</span></div>`;
    if(!items.length) wrap.innerHTML+=`<div class="empty">Nothing here right now.</div>`;
    items.forEach(l=>{
      const i=idx(l.stage), sd=staleDays(l);
      const row=document.createElement('div'); row.className='lead';
      row.innerHTML=`<div class="main" tabindex="0" role="button" aria-label="Edit ${esc(l.name)}">
          <div class="nm">${esc(l.name)}</div>
          <div class="co">${esc(l.company)}${l.company&&l.source?' / ':''}${esc(l.source)}</div>
          ${l.stage==='lost'&&l.reason?`<div class="next">Lost: ${esc(l.reason)}</div>`:l.next?`<div class="next">Next: ${esc(l.next)}</div>`:''}
          ${sd?`<span class="chip">No contact in ${sd} days</span>`:''}
        </div>
        <div class="money">${l.value?money(+l.value):''}</div>
        <div class="moves">
          <button class="mv up" aria-label="Move up a stage" ${i<0||i>=STAGES.length-1?'disabled':''}>↑</button>
          <button class="mv dn" aria-label="Move down a stage" ${i<=0?'disabled':''}>↓</button>
        </div>`;
      const main=row.querySelector('.main');
      main.onclick=()=>openEditor(l);
      main.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openEditor(l);}};
      row.querySelector('.up').onclick=()=>move(l,1);
      row.querySelector('.dn').onclick=()=>move(l,-1);
      wrap.appendChild(row);
    });
    list.appendChild(wrap);
  });
}

function hbars(rows,fmt){ // rows: [{label,value,color}]
  const max=Math.max(1,...rows.map(r=>r.value));
  return rows.map(r=>`<div class="hb"><span>${esc(r.label)}</span><div class="track"><div class="fill" style="width:${r.value/max*100}%;--c:${r.color||'var(--ink)'}"></div></div><span class="r">${fmt(r.value)}</span></div>`).join('');
}

function renderStats(){
  const v=$('#statsView');
  if(!leads.length){ v.innerHTML=`<div class="empty">Add a few leads on the Pipeline tab and your numbers will show up here.</div>`; return; }
  const won=leads.filter(l=>l.stage==='won'), lost=leads.filter(l=>l.stage==='lost'), open=openLeads();
  const closed=won.length+lost.length, winRate=closed?won.length/closed:null;
  const cycles=won.map(l=>dd(l.created||wonDate(l),wonDate(l))).filter(n=>n>=0);
  const avgCycle=cycles.length?Math.round(cycles.reduce((a,b)=>a+b,0)/cycles.length):null;
  let h=`<div class="stats four">
    <div class="stat"><b>${pct(winRate)}</b><span>Win rate (won vs lost)</span></div>
    <div class="stat"><b>${won.length?money(sum(won)/won.length):'—'}</b><span>Average won deal</span></div>
    <div class="stat"><b>${avgCycle==null?'—':avgCycle+' days'}</b><span>Average time to close</span></div>
    <div class="stat"><b>${money(sum(won))}</b><span>Total won</span></div></div>`;
  h+=`<p class="note">${closed<10?`Based on ${closed} closed deal${closed===1?'':'s'}. Treat these rates as rough until you have 10 or more.`:`Based on ${closed} closed deals.`}</p>`;

  // Goal
  const n=new Date(), qs=iso(new Date(n.getFullYear(),Math.floor(n.getMonth()/3)*3,1));
  const wonQ=sum(won.filter(l=>wonDate(l)>=qs)), fc=weighted(open), goal=+settings.goal||0;
  const remaining=Math.max(goal-wonQ,0), cover=remaining?sum(open)/remaining:null;
  h+=`<div class="panel"><h3>Quarter goal</h3><p class="q">Will we hit our number this quarter?</p>
    <div class="goalrow"><label for="goal" style="margin:0;white-space:nowrap">Revenue goal ($)</label><input id="goal" type="number" inputmode="numeric" min="0" value="${goal||''}" placeholder="e.g. 100000"></div>`;
  if(goal){
    const w1=Math.min(wonQ/goal*100,100), w2=Math.min(fc/goal*100,100-w1);
    h+=`<div class="track" style="height:16px"><div class="fill" style="width:${w1}%;--c:var(--won)"></div><div class="fill fc" style="width:${w2}%"></div></div>
      <div class="legend"><span style="--c:var(--won)">Won ${money(wonQ)}</span><span style="--c:var(--warm)">Likely ${money(fc)}</span></div>
      <p class="q" style="margin:10px 0 0">You're tracking to about ${Math.round((wonQ+fc)/goal*100)}% of goal. ${remaining?`Open pipeline covers the remaining ${money(remaining)} ${cover.toFixed(1)}×; many teams aim for 3× because most deals won't close.`:'Goal already reached.'}</p>`;
  }
  h+=`</div>`;

  // Sources
  const srcs={}; leads.forEach(l=>{const s=l.source||'Other'; (srcs[s]=srcs[s]||{n:0,w:0,l:0,rev:0}); srcs[s].n++; if(l.stage==='won'){srcs[s].w++;srcs[s].rev+=+l.value||0;} if(l.stage==='lost')srcs[s].l++;});
  const srows=Object.entries(srcs).sort((a,b)=>b[1].rev-a[1].rev||b[1].n-a[1].n);
  h+=`<div class="panel"><h3>Lead sources</h3><p class="q">Which channels bring in deals that actually close?</p>
    <table><thead><tr><th>Source</th><th class="n">Leads</th><th class="n">Win rate</th><th class="n">Won</th></tr></thead><tbody>
    ${srows.map(([s,d])=>`<tr><td>${esc(s)}</td><td class="n">${d.n}</td><td class="n">${d.w+d.l?pct(d.w/(d.w+d.l)):'—'}</td><td class="n">${money(d.rev)}</td></tr>`).join('')}
    </tbody></table></div>`;

  // Markets
  const mk={}; leads.forEach(l=>{const m=marketOf(l), o=(mk[m]=mk[m]||{open:0,won:0,w:0,l:0,c:new Set()}); if(l.stage==='won'){o.won+=+l.value||0;o.w++;} else if(l.stage==='lost') o.l++; else o.open+=+l.value||0;});
  accounts.forEach(a=>{const m=a.market||'Unassigned'; const o=(mk[m]=mk[m]||{open:0,won:0,w:0,l:0,c:new Set()}); if(a.status==='active') o.c.add(a.id);});
  const mrows=Object.entries(mk).sort((a,b)=>b[1].won-a[1].won||b[1].open-a[1].open);
  h+=`<div class="panel"><h3>Markets</h3><p class="q">Which industries bring in the most business? Clients counts active clients only.</p>
    <table><thead><tr><th>Market</th><th class="n">Clients</th><th class="n">Open</th><th class="n">Won</th><th class="n">Win rate</th></tr></thead><tbody>
    ${mrows.map(([m,d])=>`<tr><td>${esc(m)}</td><td class="n">${d.c.size}</td><td class="n">${money(d.open)}</td><td class="n">${money(d.won)}</td><td class="n">${d.w+d.l?pct(d.w/(d.w+d.l)):'—'}</td></tr>`).join('')}
    </tbody></table></div>`;

  // Time in stage
  const dur={}; leads.forEach(l=>{const hs=l.hist||[]; for(let i=0;i<hs.length-1;i++){(dur[hs[i].s]=dur[hs[i].s]||[]).push(Math.max(dd(hs[i].d,hs[i+1].d),0));}});
  const trows=STAGES.slice(0,4).map(s=>{const a=dur[s.k]||[]; return {label:s.n,value:a.length?a.reduce((x,y)=>x+y,0)/a.length:0,color:`var(--${s.k})`,has:a.length};});
  h+=`<div class="panel"><h3>Time in each stage</h3><p class="q">Where do deals slow down? Average days before a lead moved on.</p>
    ${trows.some(r=>r.has)?hbars(trows,x=>x?Math.round(x)+' days':'—'):'<p class="q">Move a few leads between stages and this will fill in.</p>'}</div>`;

  // Losses
  const byStage=STAGES.slice(0,4).map(s=>({label:s.n,value:lost.filter(l=>(l.max??0)===idx(s.k)).length,color:`var(--${s.k})`}));
  const reasons={}; lost.forEach(l=>{const r=l.reason||'No reason given'; reasons[r]=(reasons[r]||0)+1;});
  h+=`<div class="panel"><h3>Lost deals</h3><p class="q">How far did lost deals get, and why did they fall through?</p>
    ${lost.length?`<div class="split"><div>${hbars(byStage,x=>x)}</div><div>${hbars(Object.entries(reasons).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({label:k,value:v,color:'var(--lost)'})),x=>x)}</div></div>`:'<p class="q">No lost deals yet.</p>'}</div>`;

  // Aging
  const buckets=[['0–7 days',0,7],['8–14 days',8,14],['15–30 days',15,30],['30+ days',31,1e9]];
  h+=`<div class="panel"><h3>Open lead freshness</h3><p class="q">How long since we last talked to each open lead?</p>
    ${hbars(buckets.map(([lab,a,b],i)=>({label:lab,value:open.filter(l=>{const d=days(l.last)??0;return d>=a&&d<=b;}).length,color:['var(--won)','var(--warm)','var(--hot)','var(--proposal)'][i]})),x=>x)}</div>`;

  // New leads per week
  const wk=Array(8).fill(0); leads.forEach(l=>{const d=days(l.created); if(d!=null&&d>=0&&d<56) wk[7-Math.floor(d/7)]++;});
  const wmax=Math.max(1,...wk);
  h+=`<div class="panel"><h3>New leads per week</h3><p class="q">Are we filling the top of the funnel steadily?</p>
    <div class="cols">${wk.map((c,i)=>`<div class="col"><b>${c}</b><i style="height:${c/wmax*80}%"></i><span>${i===7?'This wk':(7-i)+'w ago'}</span></div>`).join('')}</div></div>`;

  v.innerHTML=h;
  $('#goal').onchange=e=>{settings.goal=+e.target.value||0; saveSettings(); renderStats();};
}


function move(l,dir){
  const i=idx(l.stage)+dir; if(i<0||i>=STAGES.length) return;
  l.stage=STAGES[i].k; l.max=Math.max(l.max??0,i); l.last=today(); track(l); markWon(l);
  save(); render();
}

const stageSel=$('#f-stage');
stageSel.innerHTML=[...STAGES,LOST].map(s=>`<option value="${s.k}">${s.n}</option>`).join('');
stageSel.onchange=()=>{$('#reasonRow').hidden=stageSel.value!=='lost';};
function syncCompany(){
  const v=$('#f-company').value.trim(), a=v?findAcct(v):null;
  $('#mktRow').hidden=!v||!!a;
  $('#openAcctBtn').hidden=!(a&&editing&&editing.accountId===a.id);
}
$('#f-company').oninput=syncCompany;
$('#openAcctBtn').onclick=()=>{ const id=editing&&editing.accountId; $('#dlg').close(); if(id) openAccount(id); };
function openEditor(l,acct){
  editing=l||null;
  $('#dlgTitle').textContent=l?'Edit lead':acct?`New deal for ${acct.name}`:'Add lead';
  $('#delBtn').style.display=l?'':'none';
  $('#f-name').value=l?.name||''; $('#f-company').value=l?.company||acct?.name||''; $('#f-market').value='';
  $('#f-value').value=l?.value||''; stageSel.value=l?.stage||'cold';
  $('#f-reason').value=l?.reason||''; $('#reasonRow').hidden=stageSel.value!=='lost';
  $('#f-source').value=l?.source||(acct&&acct.status==='active'?'Existing client':'Referral'); $('#f-last').value=l?.last||today();
  $('#f-next').value=l?.next||''; $('#f-notes').value=l?.notes||'';
  $('#f-name').placeholder=acct?'Contact or project name':'';
  syncCompany();
  $('#dlg').showModal(); if(!l) $('#f-name').focus();
}
function commit(){
  const name=$('#f-name').value.trim();
  if(!name){ $('#f-name').focus(); $('#f-name').placeholder='Add a name to save this lead'; return; }
  const cname=$('#f-company').value.trim();
  const acct=cname?ensureAcct(cname,$('#f-market').value.trim()):null;
  const d={name,company:acct?acct.name:'',accountId:acct?acct.id:'',value:+$('#f-value').value||0,stage:stageSel.value,
    reason:stageSel.value==='lost'?$('#f-reason').value:'',
    source:$('#f-source').value,last:$('#f-last').value,next:$('#f-next').value.trim(),notes:$('#f-notes').value.trim()};
  const si=idx(d.stage);
  let l=editing;
  if(l){ Object.assign(l,d); if(si>=0) l.max=Math.max(l.max??0,si); track(l); }
  else{ l={id:uid(),created:today(),max:Math.max(si,0),hist:[{s:d.stage,d:today()}],...d}; leads.push(l); }
  markWon(l);
  save(); $('#dlg').close(); render();
}
$('#saveBtn').onclick=commit;
$('#cancelBtn').onclick=()=>$('#dlg').close();
$('#touchBtn').onclick=()=>{$('#f-last').value=today();};
$('#delBtn').onclick=()=>{ if(editing&&confirm(`Delete ${editing.name}?`)){ leads=leads.filter(x=>x!==editing); save(); $('#dlg').close(); render(); } };
$('#toggleLost').onclick=()=>{showLost=!showLost;render();};

$('#restoreIn').onchange=e=>{ if(e.target.files[0]) restore(e.target.files[0]); e.target.value=''; };
